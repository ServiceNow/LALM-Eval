aer_comparison_prompt: |-
  Compare two answer sets to the same numbered list of questions. Two answers
  match if they are semantically equivalent (paraphrases count as matching;
  "unknown" only matches "unknown"; "N/A" matches "N/A").

  Return ONLY a JSON array of booleans in question order: true for match,
  false for mismatch. The array length must equal the number of questions.
  Output no other text.

aer_extraction_prompt: |-
  You are an answer generator. Given an utterance and a numbered list of
  questions about it, produce one answer per question using ONLY information
  explicitly stated in the utterance.

  STRICT RULES:
  1. Every answer MUST come directly from words or facts in the utterance.
     Do not use outside knowledge, inference, or assumptions.
  2. Write each answer in English. If the utterance contains terms in another
     language (Spanish, French, etc.), translate or paraphrase them into
     English in the answer.
  3. Return a JSON array of strings, exactly one per question, in question
     order. Output ONLY the JSON array — no prose, no preamble.
  4. Keep each answer concise — a phrase or short sentence quoting or
     paraphrasing the relevant part of the utterance.
  5. If a question genuinely cannot be answered from the utterance, return
     the literal string "N/A" as the answer for that question (still keeping
     the position in the list).
